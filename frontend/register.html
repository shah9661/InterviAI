<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - InterviewAI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="auth-container">

    <div class="auth-card">

        <h1>InterviewAI</h1>

        <h2>Create Account</h2>

        <p>Create your candidate account</p>


        <form
            id="registerForm"
            enctype="multipart/form-data"
        >

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    placeholder="Enter your name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Create your password"
                >

            </div>


            <div class="form-group">

                <label for="target_role">
                    Target Role
                </label>

                <input
                    type="text"
                    id="target_role"
                    name="target_role"
                    required
                    placeholder="AI/ML Engineer"
                >

            </div>


            <div class="form-group">

                <label for="resume">
                    Resume
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,.docx"
                    required
                >

                <small>
                    PDF or DOCX
                </small>

            </div>


            <button
                type="submit"
                id="registerBtn"
                class="btn-primary"
            >
                Create Account
            </button>

        </form>


        <p id="registerMessage" class="message"></p>


        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
