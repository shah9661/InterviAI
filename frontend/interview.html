<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview - InterviewAI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        InterviewAI
    </div>

    <div class="interview-progress">

        <span>
            Question
        </span>

        <span id="questionProgress">
            0 / 0
        </span>

    </div>

</header>


<main class="interview-container">

    <section class="question-card">

        <div class="question-header">

            <div>

                <span>
                    Question
                </span>

                <h2 id="questionText">
                    Loading...
                </h2>

            </div>


            <div class="question-type">

                <span id="questionType">
                    --
                </span>

            </div>

        </div>


        <div class="answer-container">

            <label for="transcript">
                Your Answer
            </label>

            <textarea
                id="transcript"
                rows="10"
                placeholder="Enter your answer..."
            ></textarea>

        </div>


        <div class="interview-controls">

            <button
                id="startRecordingBtn"
                class="btn-secondary"
            >
                Start Recording
            </button>


            <button
                id="stopRecordingBtn"
                class="btn-secondary"
                disabled
            >
                Stop Recording
            </button>


            <button
                id="submitAnswerBtn"
                class="btn-primary"
            >
                Submit Answer
            </button>

        </div>


        <div class="timer">

            <span>
                Duration:
            </span>

            <span id="duration">
                0
            </span>

            <span>
                seconds
            </span>

        </div>


        <p
            id="interviewMessage"
            class="message"
        ></p>

    </section>

</main>


<script src="js/api.js"></script>
<script src="js/interview.js"></script>

</body>
</html>
